# Tested environment for PyAeroFlow: exact versions from conda-forge.
#
#   conda env create -f environment.yml
#   conda activate pyaeroflow
#   pip install -e . --no-deps
#
# On Intel macOS, conda-forge is the only source of jaxlib (no PyPI wheels).
name: pyaeroflow
channels:
  - conda-forge
dependencies:
  - python=3.13
  - jax=0.10.2
  - jaxlib=0.10.2
  - numpy=2.5.4
  - scipy=1.18.1
  - matplotlib-base=3.11.2
  - pytest=9.1.1
  - ruff=0.16.8
  - pip
