# SD7003 at Re = 6e4 with the k-omega SST model (SST-2003m, L2), fully
# turbulent: the baseline for aft_sd7003.toml (docs/validation.md section 9).
# Mesh: ../meshes/sd7003_C10_W25_320k_cells.su2, a C-type PyAero mesh (320 600
# cells; C10: tunnel 10 chords above and below, W25: 25 chords of wake) of the
# CST-resampled SD7003 contour (1000 points, PyAero 3.0), sharp trailing edge.
# ../meshes/sd7003_C10_W25_320k_cells_blunt_TE.su2 is the same with a 0.3 %
# chord blunt trailing edge (326 580 cells). Boundary faces: airfoil, inlet,
# outlet, top, bottom (see examples/meshes/README.md).
# Freestream Tu = 0.1 %, nu_t/nu = 1 (the SST default, given explicitly).
# Polar: pyaeroflow polar examples/cases/sst_sd7003.toml --alpha 0 2 4 6 8

[case]
name = "sst_sd7003"

[mesh]
file = "../meshes/sd7003_C10_W25_320k_cells.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sst"

[fluid]
density = 1.0                     # kg/m^3
viscosity = 1.6667e-5             # Pa s: Re = 6e4 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord
vortex_correction = true

[initial]
from_boundary = "inlet"

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0             # deg, overridden by the polar
pressure = 0.0
turbulence = { turbulent_viscosity_ratio = 1.0, intensity = 0.001 }

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { turbulent_viscosity_ratio = 1.0, intensity = 0.001 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { turbulent_viscosity_ratio = 1.0, intensity = 0.001 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { turbulent_viscosity_ratio = 1.0, intensity = 0.001 }

[numerics]
limiter = "venkatakrishnan"
limiter_freeze = { after_residual_drop = 1.5, after_iterations = 40, release = true }

[solver]
residual_drop = 7.0
max_iterations = 2000
cfl = { control = "ser" }
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
linear_solver = { type = "pardiso" }   # remove or use "direct" without pypardiso

[output]
directory = "output/sst_sd7003"
restart_interval = 50
force_boundaries = ["airfoil"]
