# NACA 0012 at Re = 6e6, alpha = 0, SA-neg with prescribed transition at
# x/c = 0.45 on both sides at alpha = 0 (a representative free-transition
# location; the proper values come from XFOIL's e^N method or from experiment,
# per angle of attack). Compared
# with Abbott & von Doenhoff's smooth-airfoil drag at Re 6e6 (CD = 0.0058 at
# CL = 0) and Ladson's tripped data (0.0081). Same mesh and numerics as
# naca0012_pyaero_rans.toml; a restart from a fully turbulent solution
# halves the iteration count. Result with the hard switch (ramp 0): CD =
# 0.00533 (pressure 0.00104, viscous 0.00429), residual stalled at 1e-7.
[case]
name = "naca0012_pyaero_transition"

[mesh]
file = "../meshes/naca0012_pyaero_100k_y1.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[physics.transition]
mode = "prescribed"               # laminar up to the transition location (D15)
boundary = "airfoil"
ramp = 0.02                       # m: production blended in over 2 % chord
by_alpha = [                      # transition locations in m from the leading
  { alpha = 0.0, upper = 0.45, lower = 0.45 },   # edge (XFOIL xtr times the
  { alpha = 4.0, upper = 0.30, lower = 0.60 },   # chord), interpolated to the
  { alpha = 8.0, upper = 0.10, lower = 0.75 },   # case's angle of attack; also
]                                 # used by "pyaeroflow polar". PLACEHOLDER values:
                                  # replace by XFOIL's e^N results for your case.

[fluid]
density = 1.0                     # kg/m^3
viscosity = 1.6666667e-7          # Pa s: Re = 6e6 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord: also the vortex location
vortex_correction = true

[initial]
from_boundary = "inlet"

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 0.0            # deg
pressure = 0.0                    # Pa
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 0.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 0.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 0.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 3.0 }

[numerics]
limiter = "venkatakrishnan"       # local threshold for the start-up transient
limiter_freeze = { after_residual_drop = 1.5, after_iterations = 40, release = true }

[solver]
residual_drop = 7.0
max_iterations = 400
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
# Intel MKL PARDISO: 3.5x faster factorization than the default SuperLU
# ("direct"), needs the pypardiso package (conda install -c conda-forge
# pypardiso); remove the line or set type = "direct" without it.
linear_solver = { type = "pardiso" }

[output]
directory = "output/naca0012_pyaero_transition"
force_boundaries = ["airfoil"]
