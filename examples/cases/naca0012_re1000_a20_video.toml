# Laminar NACA 0012, Re = 1000, alpha = 20 deg. Phase 2 (video): restart
# from the final backup of the spin-up (naca0012_re1000_a20_spinup.toml) and
# write the frames for ParaView (open <name>.pvd, File > Save Animation).
# Before running, set initial.restart to the backup that phase 1 wrote last
# and end_time to (final time of phase 1) + 12 s (end_time is a total: the
# step counter and time continue). Same case name and directory: the log,
# history and probe CSV continue.
# The restart file and end_time below are those of the author's spin-up (backup 1775,
# t = 35.7): replace them with the values of your own run.
# Time unit: c/U = 1 s.

[case]
name = "naca0012_re1000_a20"

[mesh]
file = "naca0012_shedding.su2"    # boundary faces: airfoil, farfield

[physics]
model = "laminar"

[fluid]
density = 1.0                     # kg/m^3
reynolds_number = 1000.0          # with U_ref = 1 m/s and L_ref = 1 m (chord)

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord

[initial]
restart = "output/naca0012_re1000_a20/naca0012_re1000_a20.backup_001775.npz"   # last backup of phase 1 (pyaeroflow restart-info FILE)

[boundary.airfoil]
type = "wall"

[boundary.farfield]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 20.0            # deg
pressure = 0.0                    # Pa

[numerics]
limiter = "none"                  # smooth laminar flow, unlimited second order

[time]
mode = "unsteady"
scheme = "bdf2"
time_step = 0.02                  # s = 0.02 c/U
end_time = 47.7                   # s: final time of phase 1 + 12 s (about 6 periods, 600 steps)
inner_iterations = 30
inner_residual_drop = 3.0
convergence = { fields = [] }      # run to end_time

[solver]
linear_solver = { type = "pardiso" }

[output]
directory = "output/naca0012_re1000_a20"
force_boundaries = ["airfoil"]
fields = ["vorticity", "q_criterion", "cp", "velocity_magnitude"]   # scalars only: smaller files
fields_interval = 2               # one frame every 2 steps = 0.04 c/U (about 50 frames per period)
restart_interval = 50
restart_backup_interval = 100
probes = [[2.0, -0.4], [3.0, -0.6]] # in the wake, below the line from the TE along the freestream
