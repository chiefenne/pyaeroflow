# Diagnostic: time-accurate (dual time, BDF2) run of the E387 at alpha = 8,
# Re 2e5, BCM, from the end state of the steady alpha = 8 run, which does not
# converge (forces cycle in pseudo-time with ~120 iterations period). If the
# forces settle in physical time, a steady state exists and the pseudo-time
# cycling is a solver-path effect; if they oscillate, the flow (or the BCM
# model) is unsteady at this angle. Differences to the steady case: no
# limiter (the steady run releases it after 40 iterations), no farfield
# vortex correction (steady-only), so C_L is not directly comparable.
# Run the steady polar at alpha = 8 first (restart file below).
# pyaeroflow run examples/cases/e387_alpha8_unsteady.toml

[case]
name = "e387_alpha8_unsteady"

[mesh]
file = "../meshes/e387_pyaero_y1.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[physics.transition]
model = "bcm"
turbulence_intensity = 0.001      # fraction: 0.1 % (LTPT)

[fluid]
density = 1.0                     # kg/m^3
viscosity = 5.0e-6                # Pa s: Re = 2e5 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord: also the vortex location
vortex_correction = false        # steady-only (P10)

[initial]
from_boundary = "inlet"
restart = "output/e387_transition/alpha_8/e387_transition_alpha_8.restart.npz"

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 8.0             # deg
pressure = 0.0                    # Pa
turbulence = { nu_tilde_ratio = 0.1 }   # laminar freestream for the BCM model

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[numerics]
limiter = "none"                  # unlimited second order, as the released steady runs

[time]
mode = "unsteady"
scheme = "bdf2"
time_step = 0.02                  # s = 0.02 c/U
end_time = 5.0                    # s = 5 chord transits, 250 steps
inner_iterations = 30
inner_residual_drop = 3.0

[solver]
cfl = { control = "ser" }         # proportional SER, GMRES-modulated (D55)
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
# Intel MKL PARDISO: 3.5x faster factorization than the default SuperLU
# ("direct"), needs the pypardiso package (conda install -c conda-forge
# pypardiso); remove the line or set type = "direct" without it.
linear_solver = { type = "pardiso" }

[output]
directory = "output/e387_alpha8_unsteady"
force_boundaries = ["airfoil"]
