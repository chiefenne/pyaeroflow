# E387 alpha = 8, BDF2 with time step 0.01 (half of 0.02), nu_tilde cap 1.
# Restart from step 300 (t = 6.0) of the e387_alpha8_unsteady_cap1 run: tests
# whether the CL/CD oscillation (period about 0.3 c/U) depends on the time step.
# Time restarts at 0: t(this run) = t(dt 0.02 run) - 6.0, so end_time 1.8 is
# t = 7.8 there. The first step is BDF1 (the restart stores the state only).
# Compare CL(t + 6.0) with the dt = 0.02 log: peaks at t = 7.28 and 7.60.
# pyaeroflow run e387_alpha8_unsteady_cap1_dt001.toml

[case]
name = "e387_alpha8_unsteady_cap1_dt001"

[mesh]
file = "../meshes/e387_pyaero_y1.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[physics.transition]
model = "bcm"
turbulence_intensity = 0.001      # fraction: 0.1 % (LTPT)

[fluid]
density = 1.0                     # kg/m^3
viscosity = 5.0e-6                # Pa s: Re = 2e5 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord: also the vortex location
vortex_correction = false        # steady-only (P10)

[initial]
from_boundary = "inlet"
restart = "output/e387_alpha8_unsteady_cap1/e387_alpha8_unsteady_cap1.restart_000300.npz"   # adjust if needed

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 8.0             # deg
pressure = 0.0                    # Pa
turbulence = { nu_tilde_ratio = 0.1 }   # laminar freestream for the BCM model

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[numerics]
limiter = "none"                  # unlimited second order, as the released steady runs

[time]
mode = "unsteady"
scheme = "bdf2"
time_step = 0.01                  # s = 0.01 c/U
end_time = 1.8                   # s: 180 steps, t = 7.8 of the dt = 0.02 run
inner_iterations = 30
inner_residual_drop = 3.0

[solver]
nu_tilde_step_limit = 1.0         # cap each inner nu_tilde update to 1 x max(|nu_tilde|, nu)
cfl = { control = "ser" }         # proportional SER, GMRES-modulated (D55)
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
# Intel MKL PARDISO: 3.5x faster factorization than the default SuperLU
# ("direct"), needs the pypardiso package (conda install -c conda-forge
# pypardiso); remove the line or set type = "direct" without it.
linear_solver = { type = "pardiso" }

[output]
directory = "output/e387_alpha8_unsteady_cap1_dt001"
restart_interval = 25
restart_backup_interval = 50
force_boundaries = ["airfoil"]
