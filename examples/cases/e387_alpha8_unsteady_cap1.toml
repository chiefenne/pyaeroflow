# E387 alpha = 8, Re 2e5, BCM: BDF2 rerun from the steady cap 1 / 800 state,
# with the nu_tilde step cap in the inner iterations and restart files.
# Branch claude/gamma-diagnostics-relaxation. Adjust initial.restart to where
# your alpha_8_iter800_cap1 restart file is.
# pyaeroflow run e387_alpha8_unsteady_cap1.toml

[case]
name = "e387_alpha8_unsteady_cap1"

[mesh]
file = "../meshes/e387_pyaero_y1.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[physics.transition]
model = "bcm"
turbulence_intensity = 0.001      # fraction: 0.1 % (LTPT)

[fluid]
density = 1.0                     # kg/m^3
viscosity = 5.0e-6                # Pa s: Re = 2e5 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord: also the vortex location
vortex_correction = false        # steady-only (P10)

[initial]
from_boundary = "inlet"
restart = "output/e387_transition/alpha_8_iter800_cap1/e387_transition_alpha_8.restart.npz"   # adjust

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0                    # m/s
angle_of_attack = 8.0             # deg
pressure = 0.0                    # Pa
turbulence = { nu_tilde_ratio = 0.1 }   # laminar freestream for the BCM model

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 8.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[numerics]
limiter = "none"                  # unlimited second order, as the released steady runs

[time]
mode = "unsteady"
scheme = "bdf2"
time_step = 0.02                  # s = 0.02 c/U
end_time = 15.0                   # s = 15 chord transits, 750 steps
inner_iterations = 30
inner_residual_drop = 3.0

[solver]
nu_tilde_step_limit = 1.0         # cap each inner nu_tilde update to 1 x max(|nu_tilde|, nu)
cfl = { control = "ser" }         # proportional SER, GMRES-modulated (D55)
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
# Intel MKL PARDISO: 3.5x faster factorization than the default SuperLU
# ("direct"), needs the pypardiso package (conda install -c conda-forge
# pypardiso); remove the line or set type = "direct" without it.
linear_solver = { type = "pardiso" }

[output]
directory = "output/e387_alpha8_unsteady_cap1"
restart_interval = 25             # rolling restart_a / restart_b, every 25 steps
restart_backup_interval = 100     # restart_000100.npz, ... kept
restart_backup_at = [260, 275, 300, 310]   # extra backups before the step where the last run lost the inner convergence (313)
force_boundaries = ["airfoil"]
