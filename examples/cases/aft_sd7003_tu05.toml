# SD7003 at Re = 6e4, SA-AFT2019b, at the Tu of the Herbst et al. 2017 baseline
# (UniBw AWM, Tu 0.5 %: separation bubble at alpha 4 and 8, Cp, c_n polar;
# docs/validation.md section 9). Sharp trailing edge.
# Mesh: ../meshes/sd7003_C10_W25_320k_cells.su2 (PyAero C-mesh, C10: tunnel 10 chords above and
# below, W25: 25 chords of wake; boundary faces airfoil, inlet, outlet, top,
# bottom; see examples/meshes/README.md).
# N_crit = 4.29 from Tu = 0.5 % (Mack/Drela).
# Polar: pyaeroflow polar examples/cases/aft_sd7003_tu05.toml --alpha 4 6 8 9

[case]
name = "aft_sd7003_tu05"

[mesh]
file = "../meshes/sd7003_C10_W25_320k_cells.su2"   # boundary faces: airfoil, inlet, outlet, top, bottom

[physics]
model = "rans"
turbulence = "sa-neg"

[physics.transition]
model = "aft"
turbulence_intensity = 0.005      # fraction: 0.5 % -> N_crit = 4.29 (Mack/Drela)

[fluid]
density = 1.0                     # kg/m^3
viscosity = 1.6667e-5             # Pa s: Re = 6e4 with U = 1 m/s, c = 1 m

[reference]
velocity = 1.0                    # m/s
length = 1.0                      # m, chord
moment_center = [0.25, 0.0]       # m, quarter chord
vortex_correction = true

[initial]
from_boundary = "inlet"

[boundary.airfoil]
type = "wall"

[boundary.inlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0             # deg, overridden by the polar
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.outlet]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.top]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[boundary.bottom]
type = "farfield"
velocity = 1.0
angle_of_attack = 4.0
pressure = 0.0
turbulence = { nu_tilde_ratio = 0.1 }

[numerics]
limiter = "venkatakrishnan"
limiter_freeze = { after_residual_drop = 1.5, after_iterations = 40, release = true }

[solver]
residual_drop = 7.0
max_iterations = 2000
cfl = { control = "ser" }
newton_krylov = { switch_at_residual_drop = 1.5, switch_at_iteration = 40 }
linear_solver = { type = "pardiso" }   # remove or use "direct" without pypardiso

[output]
directory = "output/aft_sd7003_tu05"
restart_interval = 50
force_boundaries = ["airfoil"]
